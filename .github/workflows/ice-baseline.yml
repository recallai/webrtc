name: Diagnose unpatched ICE on macOS

on:
  push:
    branches: [codex/ice-ci-baseline]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p webrtc-ice --lib -- --test-threads=1
